name: Check prototype

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check types and behavior
        run: npm run check
      - name: Build application, source archive and Chrome package
        run: npm run build:extension
      - name: Save the Chrome test package
        uses: actions/upload-artifact@v4
        with:
          name: review-studio-chrome-0.8
          path: dist/developer/review-studio-extension.zip
          if-no-files-found: error
          retention-days: 14
